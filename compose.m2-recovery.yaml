services:
  postgres-recovery:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: ${M2_RECOVERY_DATABASE:?set in ignored staging environment}
      POSTGRES_USER: ${M2_RECOVERY_PLATFORM_USER:?set in ignored staging environment}
      POSTGRES_PASSWORD: ${M2_RECOVERY_PLATFORM_PASSWORD:?set in ignored staging environment}
    ports:
      - "127.0.0.1:${M2_RECOVERY_PORT:?set in ignored staging environment}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - type: bind
        source: ${M2_RECOVERY_DATA_DIRECTORY:?set in ignored staging environment}
        target: /var/lib/postgresql/data
